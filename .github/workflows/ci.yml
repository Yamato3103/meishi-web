name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # spec/ の抽出ルール・スキーマ・テストベクタが妥当なJSONであることを検証する。
  # (抽出エンジンの回帰テスト本体は、エンジン実装後に MeishiKit のユニットテストへ組み込む)
  spec:
    name: Validate spec JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all JSON under spec/
        run: |
          python3 - <<'PY'
          import json, glob, sys
          files = glob.glob("spec/**/*.json", recursive=True)
          assert files, "spec/ に JSON が見つかりません"
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding="utf-8"))
                  print("OK  ", f)
              except Exception as e:
                  bad.append((f, e))
                  print("NG  ", f, e)
          sys.exit(1 if bad else 0)
          PY

  # ロジック層(Core/Data/Domain)のユニットテスト。シミュレータ不要で高速。
  meishikit:
    name: MeishiKit unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || true
      - name: swift test
        working-directory: ios/MeishiKit
        run: swift test

  # アプリシェルが iOS シミュレータ向けにビルドできることを確認する。
  app-build:
    name: Build app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || true
      - name: Build
        working-directory: ios/MeishiVault
        run: |
          xcodebuild build \
            -scheme MeishiVault \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

  # Web版: 型チェック・テスト・本番ビルド。spec/ の抽出回帰テストも含む。
  web:
    name: Web (typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm test -- --run
      - name: Set up OCR assets (worker/core copy + traineddata download)
        working-directory: web
        run: npm run setup:ocr
      - working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
