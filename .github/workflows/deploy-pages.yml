name: Deploy Web to GitHub Pages

# 公開ホスティング(HTTPS・同一オリジン配信)。main に push されたら web/dist を GitHub Pages へ。
# 事前準備(1回だけ、リポジトリの Settings で): Settings → Pages → Source を
# 「GitHub Actions」に変更する。認証情報の入力は不要(GITHUB_TOKEN を自動使用)。
on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Set up OCR assets (worker/core copy + traineddata download)
        working-directory: web
        run: npm run setup:ocr
      - working-directory: web
        # GitHub Pages のプロジェクトページは https://<user>.github.io/<repo>/ 配下になるため、
        # リポジトリ名を base path として埋め込む(組織/ユーザーサイトやカスタムドメインで
        # ルート配信する場合は VITE_BASE_PATH="/" を明示的に渡す)。
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
